services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: kronos_timescale
    environment:
      POSTGRES_DB: kronos_nse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kronos
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kronos_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  timescaledb_test:
    image: timescale/timescaledb:latest-pg15
    container_name: kronos_timescale_test
    environment:
      POSTGRES_DB: kronos_nse_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kronos
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

volumes:
  timescale_data:
  redis_data:
