[project]
name = "kronos-nse"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "SmartApi-python>=1.3",
    "pyotp>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "schedule>=1.2",
    "httpx>=0.26",
    "structlog>=24.0",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_nse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
